<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Stage — The Conservatory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            color: white;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 600px; width: 100%; }
        h1 {
            color: #d49b6e;
            font-size: 3rem;
            font-family: serif;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .sub {
            color: #888;
            font-size: 1rem;
            font-family: serif;
            margin-bottom: 30px;
        }

        /* The Drag Puzzle */
        .puzzle-area {
            margin: 30px auto;
            width: 300px;
            height: 300px;
            border: 2px solid #333;
            border-radius: 20px;
            position: relative;
            background: #111;
            touch-action: none;
        }
        .target {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid #d49b6e;
            border-radius: 50%;
            top: 120px;
            left: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d49b6e;
            font-size: 0.8rem;
            font-weight: bold;
            pointer-events: none;
        }
        .draggable {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #d49b6e;
            border-radius: 50%;
            top: 20px;
            left: 20px;
            cursor: grab;
            box-shadow: 0 0 30px rgba(212, 155, 110, 0.2);
            touch-action: none;
            transition: none;
            z-index: 10;
        }
        .draggable:active {
            cursor: grabbing;
        }
        .instruction {
            color: #888;
            font-size: 0.9rem;
            margin: 15px 0;
            min-height: 24px;
        }

        #unlock-wrapper {
            margin-top: 25px;
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
        }
        #unlock-wrapper.reveal {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        #unlock-btn {
            display: inline-block;
            padding: 16px 48px;
            background: #d49b6e;
            color: #0d0d0d;
            font-size: 1.4rem;
            font-weight: bold;
            font-family: serif;
            text-decoration: none;
            border-radius: 60px;
            transition: all 0.4s ease;
            box-shadow: 0 0 25px rgba(212, 155, 110, 0.2);
        }
        #unlock-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(212, 155, 110, 0.5);
        }
        .footer {
            margin-top: 50px;
            font-size: 0.75rem;
            color: #2a2a2a;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Open Stage</h1>
        <p class="sub">The Conservatory of Actors</p>

        <div class="instruction" id="instruction">👆 Drag the dot onto the golden ring</div>

        <div class="puzzle-area" id="puzzleArea">
            <div class="target">✦</div>
            <div class="draggable" id="draggableDot"></div>
        </div>

        <div id="unlock-wrapper">
            <a href="https://theconservatoryofactors.univer.se/" id="unlock-btn">Enter the Stage</a>
        </div>

        <div class="footer">✦ built for the craft ✦</div>
    </div>

    <script>
        const draggable = document.getElementById('draggableDot');
        const puzzleArea = document.getElementById('puzzleArea');
        const instruction = document.getElementById('instruction');
        const unlockWrapper = document.getElementById('unlock-wrapper');

        let isDragging = false;
        let startX, startY, currentX, currentY;

        // Touch events for iPad
        draggable.addEventListener('touchstart', startDrag);
        draggable.addEventListener('touchmove', drag);
        draggable.addEventListener('touchend', endDrag);

        // Mouse events for fallback (if someone uses a mouse)
        draggable.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', endDrag);

        function startDrag(e) {
            isDragging = true;
            const touch = e.touches ? e.touches[0] : e;
            const rect = puzzleArea.getBoundingClientRect();
            startX = touch.clientX - rect.left - 25;
            startY = touch.clientY - rect.top - 25;
            draggable.style.cursor = 'grabbing';
            e.preventDefault();
        }

        function drag(e) {
            if (!isDragging) return;
            const touch = e.touches ? e.touches[0] : e;
            const rect = puzzleArea.getBoundingClientRect();
            currentX = touch.clientX - rect.left - 25;
            currentY = touch.clientY - rect.top - 25;
            
            // Keep dot inside the box
            currentX = Math.max(0, Math.min(currentX, 300 - 50));
            currentY = Math.max(0, Math.min(currentY, 300 - 50));

            draggable.style.left = currentX + 'px';
            draggable.style.top = currentY + 'px';
            e.preventDefault();
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            draggable.style.cursor = 'grab';

            // Check if dot is over the target (centered at 120, 120)
            const targetCenterX = 120;
            const targetCenterY = 120;
            const dotCenterX = currentX + 25;
            const dotCenterY = currentY + 25;
            const distance = Math.sqrt(
                Math.pow(dotCenterX - targetCenterX, 2) + 
                Math.pow(dotCenterY - targetCenterY, 2)
            );

            if (distance < 40) {
                // Unlock!
                instruction.textContent = '✨ Stage unlocked!';
                unlockWrapper.classList.add('reveal');
                draggable.style.pointerEvents = 'none';
            } else {
                instruction.textContent = 'Not quite. Drag the dot onto the golden ring.';
                // Reset dot to start position
                setTimeout(() => {
                    draggable.style.left = '20px';
                    draggable.style.top = '20px';
                    currentX = 20;
                    currentY = 20;
                }, 300);
            }
        }
    </script>
</body>
</html>
