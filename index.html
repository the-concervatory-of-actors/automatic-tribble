<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Stage — The Conservatory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d0d;
            color: white;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 600px; width: 100%; }
        h1 {
            color: #d49b6e;
            font-size: 3rem;
            font-family: serif;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .sub {
            color: #888;
            font-size: 1rem;
            font-family: serif;
            margin-bottom: 30px;
        }
        
        .hint {
            color: #555;
            font-size: 0.9rem;
            font-family: serif;
            margin-bottom: 25px;
            transition: opacity 0.5s ease;
            min-height: 30px;
        }
        .hint.dim { opacity: 0.2; }
        
        .lamp {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
            background: #1a1a1a;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #333;
            cursor: pointer;
            transition: all 0.4s ease;
            border: 2px solid #222;
            user-select: none;
            position: relative;
        }
        .lamp:hover { border-color: #555; transform: scale(1.02); }
        .lamp.lit {
            background: #d49b6e;
            border-color: #d49b6e;
            box-shadow: 0 0 80px rgba(212, 155, 110, 0.7);
            color: #0d0d0d;
            transform: scale(1.05);
        }

        #unlock-wrapper {
            margin-top: 20px;
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        #unlock-wrapper.reveal {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        #unlock-btn {
            display: inline-block;
            padding: 16px 48px;
            background: transparent;
            color: #d49b6e;
            font-size: 1.4rem;
            font-weight: bold;
            font-family: serif;
            text-decoration: none;
            border: 2px solid #d49b6e;
            border-radius: 60px;
            transition: all 0.4s ease;
            letter-spacing: 2px;
        }
        #unlock-btn:hover {
            background: #d49b6e;
            color: #0d0d0d;
            box-shadow: 0 0 40px rgba(212, 155, 110, 0.3);
            transform: scale(1.02);
        }

        .footer {
            margin-top: 50px;
            font-size: 0.75rem;
            color: #2a2a2a;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Open Stage</h1>
        <p class="sub">The Conservatory of Actors</p>

        <div class="hint" id="hint">☞ tap the light to open the door</div>

        <div class="lamp" id="lamp">✦</div>

        <div id="unlock-wrapper">
            <a href="https://theconservatoryofactors.univer.se/" id="unlock-btn">Enter the Stage</a>
        </div>

        <div class="footer">✦ built for the craft ✦</div>
    </div>

    <script>
        const lamp = document.getElementById('lamp');
        const hint = document.getElementById('hint');
        const unlockWrapper = document.getElementById('unlock-wrapper');

        let isOpen = false;

        lamp.addEventListener('click', () => {
            if (!isOpen) {
                lamp.classList.add('lit');
                hint.classList.add('dim');
                isOpen = true;
                
                setTimeout(() => {
                    unlockWrapper.classList.add('reveal');
                }, 400);
            }
        });
    </script>

</body>
</html>
